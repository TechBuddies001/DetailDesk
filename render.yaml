# Render Blueprint: New → Blueprint → pick this repo. Creates one web service with a 1 GB disk for the database and photos.
services:
  - type: web
    name: detaildesk
    runtime: node
    plan: starter          # a persistent disk needs a paid plan; the free plan would lose all data on every restart
    region: singapore      # closest Render region to India
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "1"
      - key: TZ
        value: Asia/Kolkata
    disk:
      name: detaildesk-data
      mountPath: /var/data
      sizeGB: 1
